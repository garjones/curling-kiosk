# club.conf — one club's kiosk configuration.
#
# Lives in the club's PRIVATE site repo as kiosk/club.conf. kiosk-deploy
# copies it to /etc/kiosk/club.conf on every Pi; it is the same on every
# screen. What each screen shows is chosen on the Pi itself, from the SSH
# menu (kiosk-menu).
#
# No passwords in this file. Camera URLs name the camera login as the
# literal text ${CAM_USER} and ${CAM_PASS}; the real values come from
# kiosk/secrets.env.age (see secrets.example.env) and are filled in,
# URL-encoded, when the screen starts.
#
# This is a shell file: KEY="value", no spaces around =. After editing,
# check it on any Pi with:  kiosk-deploy --check

# Shown in the status bar along the bottom of every screen.
CLUB_NAME="Example Curling Club"

# Number of sheets. Every sheet needs a CAM_HOME and a CAM_AWAY below.
SHEETS=4

# One camera at each end of each sheet. "Home" is shown on the right of
# the mosaic, "away" on the left. Any stream ffplay can open works (RTSP,
# HTTP, a file). The Axis path below is only an example.
CAM_HOME[1]='rtsp://${CAM_USER}:${CAM_PASS}@192.168.10.51/axis-media/media.amp'
CAM_HOME[2]='rtsp://${CAM_USER}:${CAM_PASS}@192.168.10.52/axis-media/media.amp'
CAM_HOME[3]='rtsp://${CAM_USER}:${CAM_PASS}@192.168.10.53/axis-media/media.amp'
CAM_HOME[4]='rtsp://${CAM_USER}:${CAM_PASS}@192.168.10.54/axis-media/media.amp'

CAM_AWAY[1]='rtsp://${CAM_USER}:${CAM_PASS}@192.168.10.71/axis-media/media.amp'
CAM_AWAY[2]='rtsp://${CAM_USER}:${CAM_PASS}@192.168.10.72/axis-media/media.amp'
CAM_AWAY[3]='rtsp://${CAM_USER}:${CAM_PASS}@192.168.10.73/axis-media/media.amp'
CAM_AWAY[4]='rtsp://${CAM_USER}:${CAM_PASS}@192.168.10.74/axis-media/media.amp'

# Web pages a screen can show full-screen instead of cameras (signage,
# a counter /tv page, a menu board). The name is what the SSH menu shows.
# Leave both lists empty if the club has none.
WEB_URL[1]='https://example.com/signage'
WEB_NAME[1]='Lounge signage'

# Every Pi reboots once a day at this time (24-hour, local). Empty = never.
REBOOT_TIME="07:00"

# Every 15 minutes the Pi pings this host and reboots if it cannot reach
# it (the Wi-Fi watchdog). Use something on your own network if the
# kiosks have no internet. Empty = watchdog off.
WATCHDOG_HOST="1.1.1.1"
